---
- name: Deploy the cross-built drum machine to Raspberry Pi 3
  hosts: drum_machines
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate target compatibility with the Debian 13 ARM64 artifact
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture == 'aarch64'
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - drum_machine_user is match('^[a-z_][a-z0-9_-]*[$]?$')
          - drum_machine_root is match('^/[a-zA-Z0-9_/-]+$')
          - drum_machine_audio_driver in ['alsa', 'dummy']
          - drum_machine_audio_device is match('^[a-zA-Z0-9_:,=.-]+$')
          - drum_machine_step_buttons_enabled is boolean
          - drum_machine_i2c_device is match('^/dev/i2c-[0-9]+$')
          - drum_machine_step_addresses | length == 2
          - drum_machine_step_addresses | unique | length == 2
          - drum_machine_step_addresses[0] is match('^0x2[0-7]$')
          - drum_machine_step_addresses[1] is match('^0x2[0-7]$')
        fail_msg: This package targets Debian 13 ARM64; review the build environment for other systems.

    - name: Locate and fingerprint the local cross-build artifact
      ansible.builtin.stat:
        path: "{{ drum_machine_artifact }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: local_artifact

    - name: Require a built artifact
      ansible.builtin.assert:
        that:
          - local_artifact.stat.exists
          - local_artifact.stat.isreg | default(false)
        fail_msg: Run bash tools/build-rpi3.sh on the development computer first.

    - name: Set the immutable release directory
      ansible.builtin.set_fact:
        release_dir: "{{ drum_machine_root }}/releases/{{ local_artifact.stat.checksum }}"

  tasks:
    - name: Install runtime dependencies only
      ansible.builtin.apt:
        name:
          - libasound2t64
          - libstdc++6
          - libgcc-s1
          - alsa-utils
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure I2C for step buttons
      when: drum_machine_step_buttons_enabled
      block:
        - name: Install I2C diagnostics and kernel module tools
          ansible.builtin.apt:
            name: [i2c-tools, kmod]
            state: present

        - name: Check the configured Pi firmware configuration exists
          ansible.builtin.stat:
            path: "{{ drum_machine_boot_config }}"
          register: pi_boot_config

        - name: Require the actual firmware configuration
          ansible.builtin.assert:
            that: pi_boot_config.stat.exists
            fail_msg: Set drum_machine_boot_config to this Pi's firmware config.txt path.

        - name: Enable the header I2C bus on future boots
          ansible.builtin.blockinfile:
            path: "{{ drum_machine_boot_config }}"
            marker: '# {mark} ANSIBLE DRUM MACHINE I2C'
            block: |
              [all]
              dtparam=i2c_arm=on
          register: i2c_boot_setting

        - name: Ensure the I2C access group exists
          ansible.builtin.group:
            name: i2c
            state: present

        - name: Load the userspace I2C interface at boot
          ansible.builtin.copy:
            dest: /etc/modules-load.d/drum-machine-i2c.conf
            content: "i2c-dev\n"
            owner: root
            group: root
            mode: '0644'

        - name: Load the userspace I2C interface now
          ansible.builtin.command: /usr/sbin/modprobe i2c-dev
          changed_when: false
          when: not ansible_check_mode

        - name: Set I2C device group permissions
          ansible.builtin.copy:
            dest: /etc/udev/rules.d/70-drum-machine-i2c.rules
            content: |
              SUBSYSTEM=="i2c-dev", KERNEL=="i2c-[0-9]*", GROUP="i2c", MODE="0660"
            owner: root
            group: root
            mode: '0644'
          register: i2c_udev_rule

        - name: Reload I2C device permission rules
          ansible.builtin.command: /usr/bin/udevadm control --reload-rules
          changed_when: false
          when: i2c_udev_rule.changed and not ansible_check_mode

        - name: Apply permissions to existing I2C devices
          ansible.builtin.command: /usr/bin/udevadm trigger --subsystem-match=i2c-dev --action=add
          changed_when: false
          when: i2c_udev_rule.changed and not ansible_check_mode

        - name: Explain first-time bus activation
          ansible.builtin.debug:
            msg: I2C boot configuration updated. Reboot the Pi once to activate it; the audio/CLI service remains usable meanwhile.
          when: i2c_boot_setting.changed

    - name: Allow the existing runtime user to access audio and configured hardware
      ansible.builtin.user:
        name: "{{ drum_machine_user }}"
        groups: "{{ ['audio', 'i2c'] if drum_machine_step_buttons_enabled else ['audio'] }}"
        append: true

    - name: Create installation and release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "{{ drum_machine_root }}"
        - "{{ drum_machine_root }}/releases"
        - "{{ release_dir }}"

    - name: Extract executable, samples and licenses
      ansible.builtin.unarchive:
        src: "{{ drum_machine_artifact }}"
        dest: "{{ release_dir }}"
        owner: root
        group: root
        creates: "{{ release_dir }}/.validated"

    - name: Verify the ARM64 executable and sample loading before activation
      ansible.builtin.command:
        argv:
          - "{{ release_dir }}/bin/drum-machine"
          - --render-demo
          - "{{ release_dir }}/validation.wav"
        creates: "{{ release_dir }}/.validated"
      changed_when: false

    - name: Remove the validation audio file
      ansible.builtin.file:
        path: "{{ release_dir }}/validation.wav"
        state: absent

    - name: Mark the release as validated
      ansible.builtin.copy:
        dest: "{{ release_dir }}/.validated"
        content: "{{ local_artifact.stat.checksum }}\n"
        owner: root
        group: root
        mode: '0644'

    - name: Select the validated release
      ansible.builtin.file:
        src: "{{ release_dir }}"
        dest: "{{ drum_machine_root }}/current"
        state: link
        owner: root
        group: root
      notify: Restart drum machine

    - name: Install the system service
      ansible.builtin.template:
        src: drum-machine.service.j2
        dest: /etc/systemd/system/drum-machine.service
        owner: root
        group: root
        mode: '0644'
      notify: Restart drum machine

    - name: Install the terminal client launcher
      ansible.builtin.template:
        src: drum-machine-client.j2
        dest: /usr/local/bin/drum-machine
        owner: root
        group: root
        mode: '0755'

    - name: Apply service changes
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the drum machine at boot
      ansible.builtin.systemd_service:
        name: drum-machine.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify that the engine accepts terminal commands as the runtime user
      ansible.builtin.command:
        argv:
          - /usr/sbin/runuser
          - -u
          - "{{ drum_machine_user }}"
          - --
          - /usr/local/bin/drum-machine
          - --command
          - status
      register: service_status
      changed_when: false
      retries: 10
      delay: 2
      until: service_status.rc == 0
      when: not ansible_check_mode

    - name: Show the running engine status
      ansible.builtin.debug:
        var: service_status.stdout_lines
      when: not ansible_check_mode

  handlers:
    - name: Restart drum machine
      ansible.builtin.systemd_service:
        name: drum-machine.service
        daemon_reload: true
        state: restarted
