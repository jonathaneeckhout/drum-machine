<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
<title id="title">Raspberry Pi 3: sixteen step buttons and LEDs on two MCP23017 modules</title>
<desc id="desc">Pi physical pin 1 supplies 3.3 volts to both modules' VCC and RESET; pin 6 ground, pin 3 SDA, pin 5 SCL. Module addresses are 0x20 and 0x21. Each button closes its assigned input to ground. Each LED has its own 1 kilohm resistor from 3.3 volts to the anode, with its cathode connected to the assigned output. The table lists all sixteen step connections.</desc>
<style>text{font-family:Arial,sans-serif;fill:#17283b;font-size:18px}.heading{font-size:28px;font-weight:bold}.sub{font-size:21px;font-weight:bold}.small{font-size:16px}.mono{font-family:monospace;font-size:19px}.wire{fill:none;stroke-width:3;stroke-linecap:round}.panel{fill:#f5f8fc;stroke:#b9c8d8;stroke-width:2}</style>
<rect width="1200" height="1320" fill="white"/>

<text x="30" y="42" class="heading" text-anchor="start">Pi 3 · 16 step buttons + 16 LEDs</text>
<text x="30" y="74" class="" text-anchor="start">Logical connections, not module header positions. All supply and bus signals use 3.3 V.</text>
