<text x="30" y="880" class="sub" text-anchor="start">Step connections · button input and LED output are separate pins</text>
<text x="30" y="911" class="small" text-anchor="start">For every row: button → GND; 3.3 V → 1 kΩ → LED anode; LED cathode → LED output.</text>
